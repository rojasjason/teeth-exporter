<!doctype html><html><head><meta charset="utf-8"><title>fake viewer</title></head><body>
<canvas id="c" width="640" height="480"></canvas>
<script>
(async function(){
  // the scan, fetched like the real viewer does
  const zipRes = await fetch("/treatment_plan_video_wcc?case=test");
  await zipRes.arrayBuffer();
  // meshes the real viewer drew (July capture)
  const buf = await (await fetch("/meshes.glb")).arrayBuffer();
  const dv = new DataView(buf); let off = 12, json, bin;
  while (off < buf.byteLength) { const len = dv.getUint32(off, true), type = dv.getUint32(off + 4, true), s = off + 8;
    if (type === 0x4e4f534a) json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, s, len)));
    else if (type === 0x004e4942) bin = s;
    off = s + len + ((4 - (len % 4)) % 4); }
  function acc(i){ const a=json.accessors[i], v=json.bufferViews[a.bufferView], b=bin+(v.byteOffset||0)+(a.byteOffset||0), n=a.count*(a.type==="VEC3"?3:1);
    if (a.componentType===5126) return new Float32Array(buf.slice(b,b+n*4));
    if (a.componentType===5125) return new Uint32Array(buf.slice(b,b+n*4));
    return Uint32Array.from(new Uint16Array(buf.slice(b,b+n*2))); }
  const meshes = []; for (const m of json.meshes) for (const p of m.primitives) meshes.push({pos: acc(p.attributes.POSITION), idx: acc(p.indices)});
  const gl = document.getElementById("c").getContext("webgl2");
  if (!gl) { document.title = "NO-WEBGL"; return; }
  const vs = gl.createShader(gl.VERTEX_SHADER); gl.shaderSource(vs, "#version 300 es\nin vec3 p; void main(){ gl_Position = vec4(p*20.0, 1.0); }"); gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER); gl.shaderSource(fs, "#version 300 es\nprecision mediump float; out vec4 o; void main(){ o = vec4(1); }"); gl.compileShader(fs);
  const prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog); gl.useProgram(prog);
  const objs = meshes.map(m => { const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, m.pos, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
    const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.idx, gl.STATIC_DRAW);
    gl.bindVertexArray(null); return {vao, vb, n: m.idx.length, m}; });
  function regen(){ for (const o of objs) if (o.m.pos.length > 9000) { gl.bindBuffer(gl.ARRAY_BUFFER, o.vb); gl.bufferData(gl.ARRAY_BUFFER, o.m.pos, gl.STATIC_DRAW); } }
  let stage = 2;
  window.editor = { getViewState(){ return { camera: 1, stage: { currentStage: stage, firstStage: 0, lastStage: 6 } }; },
    setViewState(v){ stage = v.stage.currentStage; regen(); } };
  (function frame(){ gl.clear(gl.COLOR_BUFFER_BIT); for (const o of objs) { gl.bindVertexArray(o.vao); gl.drawElements(gl.TRIANGLES, o.n, gl.UNSIGNED_INT, 0); } requestAnimationFrame(frame); })();
  document.title = "READY " + meshes.length;
})().catch(e => document.title = "ERR " + e);
</script></body></html>
